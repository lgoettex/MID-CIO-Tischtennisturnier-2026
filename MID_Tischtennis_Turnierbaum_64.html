<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MID Tischtennis-Turnier</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
    padding:16px
}
h1{
    font-size:22px;
    margin-bottom:6px
}
.subtitle{
    font-size:13px;
    color:#666;
    margin-bottom:14px
}
.tb-wrap{
    overflow-x:auto;
    padding:12px 0
}
.tb-grid{
    display:flex;
    gap:0;
    align-items:stretch;
    min-width:1400px
}
.round-col{
    display:flex;
    flex-direction:column;
    min-width:170px
}
.round-header{
    font-size:11px;
    font-weight:600;
    color:#666;
    text-align:center;
    padding:6px 4px 10px;
    letter-spacing:.04em;
    text-transform:uppercase
}
.matches{
    display:flex;
    flex-direction:column;
    flex:1;
    justify-content:space-around
}
.match{
    display:flex;
    flex-direction:column;
    padding:0 4px;
    position:relative
}
.match::after{
    content:'';
    position:absolute;
    right:-1px;
    top:50%;
    width:5px;
    height:1px;
    background:#ccc
}
.player{
    display:flex;
    align-items:center;
    gap:4px;
    margin:1px 0
}
.player input[type=text]{
    font-size:11px;
    padding:3px 5px;
    border:1px solid #ddd;
    border-radius:4px;
    background:#fff;
    color:#000;
    width:100%;
    min-width:0
}
.player input[type=text]:focus{
    outline:none;
    border-color:#888
}
.score-box{
    width:24px;
    flex-shrink:0;
    font-size:11px;
    padding:3px 2px;
    border:1px solid #ddd;
    border-radius:4px;
    background:#fff;
    color:#000;
    text-align:center
}
.score-box:focus{
    outline:none;
    border-color:#888
}
.match-divider{
    height:1px;
    background:#eee;
    margin:3px 0
}
.winner-badge{
    font-size:9px;
    font-weight:600;
    background:#e6f4ea;
    color:#1a7a3c;
    border-radius:3px;
    padding:1px 4px;
    margin-left:2px;
    white-space:nowrap;
    display:none
}
.player.is-winner .winner-badge{
    display:inline
}
.player.is-winner input[type=text]{
    border-color:#6db88a;
    font-weight:600
}
.round-col.final-col .round-header{
    color:#222;
    font-size:12px
}
.trophy{
    font-size:18px;
    text-align:center;
    padding:6px 0 0
}
.btn-row{
    display:flex;
    gap:8px;
    padding:10px 4px 6px;
    flex-wrap:wrap
}
button.tb-btn{
    font-size:12px;
    padding:6px 12px;
    border:1px solid #ccc;
    border-radius:6px;
    background:#fff;
    cursor:pointer
}
button.tb-btn:hover{
    background:#eee
}
.hint{
    font-size:11px;
    color:#666;
    padding:0 4px 8px
}
.save-status{
    font-size:12px;
    color:#666;
    padding:0 4px 10px
}
</style>
</head>

<body>

<h1>🏓 MID Tischtennis-Turnier</h1>
<p class="subtitle">KO-System · 64 Teilnehmer · 6 Runden</p>

<div class="btn-row">
  <button class="tb-btn" onclick="clearAll()">🗑 Alle Namen löschen</button>
  <button class="tb-btn" onclick="clearScores()">↺ Ergebnisse zurücksetzen</button>
  <button class="tb-btn" onclick="saveData()">💾 Speichern</button>
  <button class="tb-btn" onclick="loadData()">📂 Laden</button>
  <button class="tb-btn" onclick="exportData()">📋 Daten exportieren</button>
</div>

<p class="hint">
Namen & Referat eintragen (z. B. „Müller – Ref. IT“). Punkte rechts eintragen.
Sieger werden automatisch markiert und weitergeführt.
</p>

<p class="save-status" id="save-status"></p>

<div class="tb-wrap">
  <div class="tb-grid" id="grid"></div>
</div>

<script>
const ROUNDS=[
  {name:"Runde 1",matches:32},
  {name:"Runde 2",matches:16},
  {name:"Runde 3",matches:8},
  {name:"Viertelfinale",matches:4},
  {name:"Halbfinale",matches:2},
  {name:"Finale",matches:1}
];

const STORAGE_KEY='mid_turnier_v1';

let state={};

function key(r,m,p){return `r${r}m${m}p${p}`}
function skey(r,m,p){return `s${r}m${m}p${p}`}

function getInput(k){
  return document.getElementById(k);
}

function buildGrid(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';

  ROUNDS.forEach((rd,ri)=>{
    const col=document.createElement('div');
    col.className='round-col'+(ri===ROUNDS.length-1?' final-col':'');

    const hdr=document.createElement('div');
    hdr.className='round-header';
    hdr.textContent=rd.name;
    col.appendChild(hdr);

    const matches=document.createElement('div');
    matches.className='matches';

    for(let mi=0;mi<rd.matches;mi++){

      const match=document.createElement('div');
      match.className='match';

      [0,1].forEach(pi=>{

        const row=document.createElement('div');
        row.className='player';
        row.id=`prow-${ri}-${mi}-${pi}`;

        const inp=document.createElement('input');
        inp.type='text';
        inp.placeholder=ri===0?`Spieler ${mi*2+pi+1}`:'—';
        inp.id=key(ri,mi,pi);
        inp.value=state[key(ri,mi,pi)]||'';

        inp.addEventListener('input',()=>{
          state[key(ri,mi,pi)]=inp.value;
          autoSave();
        });

        const sc=document.createElement('input');
        sc.type='text';
        sc.inputMode='numeric';
        sc.className='score-box';
        sc.id=skey(ri,mi,pi);
        sc.value=state[skey(ri,mi,pi)]||'';
        sc.placeholder='—';
        sc.maxLength=2;

        sc.addEventListener('input',()=>{
          state[skey(ri,mi,pi)]=sc.value;
          updateWinner(ri,mi);
          autoSave();
        });

        const badge=document.createElement('span');
        badge.className='winner-badge';
        badge.textContent='✓';

        row.appendChild(inp);
        row.appendChild(sc);
        row.appendChild(badge);

        match.appendChild(row);

        if(pi===0){
          const div=document.createElement('div');
          div.className='match-divider';
          match.appendChild(div);
        }
      });

      matches.appendChild(match);
    }

    col.appendChild(matches);

    if(ri===ROUNDS.length-1){
      const trophy=document.createElement('div');
      trophy.className='trophy';
      trophy.innerHTML='🏆';
      col.appendChild(trophy);
    }

    grid.appendChild(col);
  });

  ROUNDS.forEach((_,ri)=>{
    for(let mi=0;mi<ROUNDS[ri].matches;mi++){
      updateWinner(ri,mi);
    }
  });
}

function updateWinner(ri,mi){

  const s0=parseInt(state[skey(ri,mi,0)])||0;
  const s1=parseInt(state[skey(ri,mi,1)])||0;

  const row0=document.getElementById(`prow-${ri}-${mi}-0`);
  const row1=document.getElementById(`prow-${ri}-${mi}-1`);

  if(!row0 || !row1) return;

  row0.classList.remove('is-winner');
  row1.classList.remove('is-winner');

  const sc0=state[skey(ri,mi,0)];
  const sc1=state[skey(ri,mi,1)];

  if(sc0!==undefined && sc0!=='' && sc1!==undefined && sc1!==''){

    const winner=s0>s1?0:s1>s0?1:-1;

    if(winner===0) row0.classList.add('is-winner');
    if(winner===1) row1.classList.add('is-winner');

    if(winner>=0 && ri+1<ROUNDS.length){

      const nextMatch=Math.floor(mi/2);
      const nextPlayer=mi%2;

      const wName=state[key(ri,mi,winner)]||'';

      const nk=key(ri+1,nextMatch,nextPlayer);

      state[nk]=wName;

      const inp=getInput(nk);

      if(inp) inp.value=wName;
    }
  }
}

function autoSave(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));

  document.getElementById('save-status').textContent=
    '✓ Automatisch gespeichert ('+
    new Date().toLocaleTimeString('de-DE')+
    ')';
}

function saveData(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));

  document.getElementById('save-status').textContent=
    '💾 Gespeichert';
}

function loadData(){

  const raw=localStorage.getItem(STORAGE_KEY);

  if(raw){
    state=JSON.parse(raw);
    buildGrid();

    document.getElementById('save-status').textContent=
      '📂 Daten geladen';
  }else{
    alert('Keine gespeicherten Daten gefunden.');
  }
}

function clearAll(){

  if(!confirm('Wirklich alle Namen löschen?')) return;

  Object.keys(state).forEach(k=>{
    if(k.startsWith('r')) delete state[k];
  });

  buildGrid();
  autoSave();
}

function clearScores(){

  if(!confirm('Alle Ergebnisse zurücksetzen?')) return;

  Object.keys(state).forEach(k=>{
    if(k.startsWith('s')) delete state[k];
  });

  buildGrid();
  autoSave();
}

function exportData(){

  const blob=new Blob(
    [JSON.stringify(state,null,2)],
    {type:'application/json'}
  );

  const a=document.createElement('a');

  a.href=URL.createObjectURL(blob);
  a.download='turnierdaten.json';

  a.click();
}

const saved=localStorage.getItem(STORAGE_KEY);

if(saved){
  try{
    state=JSON.parse(saved);
  }catch(e){
    state={};
  }
}

buildGrid();
</script>

</body>
</html>
